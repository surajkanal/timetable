<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Division Links</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
    }
    .container {
        width: min(92%, 420px);
        background: white;
        padding: 30px 22px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        text-align: center;
    }
    h1 {
        margin: 0 0 8px;
        font-size: 26px;
        color: #222;
    }
    p {
        margin: 0 0 25px;
        color: #666;
        font-size: 14px;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin: 14px 0;
        border-radius: 12px;
        text-decoration: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
        transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .div-a { background: #1a73e8; }
    .div-b { background: #188038; }
</style>
</head>
<body>
<div class="container">
    <h1>Division Links</h1>
    <p>Select your division</p>

    <a class="btn div-a"
       href="https://docs.google.com/spreadsheets/d/1h_iRzU5n7r1ca-cWo2IYh_oxdMfn9LBQlisoCVXyY24/edit?usp=sharing">
       LINK DIV A
    </a>

    <a class="btn div-b"
       href="https://docs.google.com/spreadsheets/d/1q90YJE0OTj7MQAZqkQkVBWc44qoBlq7bpHpCqLK34hA/edit?usp=sharing">
       LINK DIV B
    </a>

    <a class="btn" style="background:#7b1fa2;"
       href="https://docs.google.com/spreadsheets/d/1VSDlE-7Kjo7mWV8QyhZu8h8f0F6rQvfM/edit?usp=sharing&ouid=109325976577528208124&rtpof=true&sd=true">
       BMS TIMETABLE
    </a>
</div>
</body>
</html>
